name: DevSecOps CI & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Stage 1: Code Quality, Type Verification & Bundle Compilation
  # ============================================================================
  build-and-lint:
    name: 🛠️ Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies (Clean Install)
        run: npm ci

      - name: 🔍 TypeScript Compilation Check
        run: npx tsc -b

      - name: ⚡ Vite Production Build
        run: npm run build

      - name: 📊 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 7

  # ============================================================================
  # Stage 2: Shift-Left Security & Vulnerability Scanning (DevSecOps)
  # ============================================================================
  security-audit:
    name: 🛡️ Shift-Left Security Audit
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔒 Dependency Audit (NPM Vulnerability Check)
        run: npm audit --audit-level=critical || true

      - name: 🛡️ Run Trivy Vulnerability Scanner (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  # ============================================================================
  # Stage 3: Multi-Stage Docker Image Build Test
  # ============================================================================
  docker-build:
    name: 🐳 Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: 🐳 Build Docker Container (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bharath-portfolio:latest
